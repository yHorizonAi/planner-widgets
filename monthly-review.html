<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Review</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
    background: transparent;
  }

  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    padding: 12px 0;
  }

  .widget {
    background: linear-gradient(135deg, #eef0fb 0%, #e8e4f5 50%, #dde8f8 100%);
    border-radius: 20px;
    padding: 22px 28px;
    text-align: center;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(180, 180, 230, 0.3);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    min-width: 220px;
    max-width: 320px;
    width: 100%;
  }

  .widget::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(220,180,240,0.2) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }

  .sparkles {
    position: absolute;
    font-size: 8px;
    color: rgba(196, 160, 200, 0.4);
  }
  .sparkles.s1 { top: 14px; left: 18px; }
  .sparkles.s2 { top: 14px; right: 18px; }

  .period-label {
    font-family: 'Lora', serif;
    font-weight: 700;
    font-size: 21px;
    letter-spacing: 0.03em;
    color: #6a5a8a;
    margin-bottom: 18px;
    position: relative;
    z-index: 1;
  }

  .icon {
    width: 18px;
    height: 18px;
    margin-right: 8px;
    flex-shrink: 0;
    vertical-align: middle;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    position: relative;
    z-index: 1;
  }

  .row-label {
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: #6a5a8a;
    text-align: left;
    flex: 1;
    display: flex;
    align-items: center;
  }

  .counter {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .count-btn {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1px solid rgba(196,160,200,0.4);
    background: rgba(255,255,255,0.6);
    color: #7a5c8a;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    line-height: 1;
  }

  .count-btn:hover {
    background: rgba(196,160,200,0.2);
    transform: scale(1.1);
  }

  .count-val {
    font-family: 'Lora', serif;
    font-size: 20px;
    font-weight: 700;
    color: #7a5c8a;
    min-width: 28px;
    text-align: center;
  }

  .divider {
    height: 1px;
    background: rgba(196,160,200,0.2);
    margin: 12px 0;
  }

  .section-label {
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: #6a5a8a;
    margin-bottom: 8px;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .chips {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 12px;
  }

  .chip {
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 5px 12px;
    border-radius: 20px;
    cursor: pointer;
    border: 1px solid rgba(180,180,230,0.3);
    background: rgba(255,255,255,0.4);
    color: #a0a0c0;
    transition: all 0.2s;
  }

  .chip.active-low {
    background: rgba(255, 180, 180, 0.25);
    border-color: rgba(255,160,160,0.5);
    color: #c07070;
  }

  .chip.active-mid {
    background: rgba(255, 210, 150, 0.25);
    border-color: rgba(255,190,100,0.5);
    color: #b08040;
  }

  .chip.active-high {
    background: rgba(160, 210, 160, 0.3);
    border-color: rgba(120,190,120,0.5);
    color: #507050;
  }

  .reset-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: #a0a0c0;
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    margin-top: 4px;
    transition: color 0.15s;
    max-width: 100%;
    white-space: normal;
    text-align: center;
    line-height: 1.5;
  }

  .reset-btn.confirming {
    color: #c07070;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .save-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.05em;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    border: 1px solid rgba(122, 92, 138, 0.4);
    background: linear-gradient(135deg, rgba(122,92,138,0.15), rgba(140,160,220,0.15));
    color: #6a5a8a;
    transition: all 0.2s;
  }

  .save-btn:hover {
    background: rgba(122,92,138,0.25);
    transform: translateY(-1px);
  }

  .save-btn.confirming {
    border-color: rgba(192,112,112,0.7);
    background: rgba(192,112,112,0.12);
    color: #c07070;
    gap: 8px;
  }

  .save-confirm-text {
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    font-size: 10.5px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .save-confirm-actions {
    display: inline-flex;
    gap: 6px;
  }

  .save-yes, .save-no {
    font-family: 'Lora', serif;
    font-weight: 700;
    font-size: 10px;
    padding: 3px 9px;
    border-radius: 12px;
    cursor: pointer;
    line-height: 1.4;
  }

  .save-yes {
    background: rgba(192,112,112,0.85);
    color: #fff;
  }

  .save-no {
    background: rgba(255,255,255,0.6);
    color: #c07070;
    border: 1px solid rgba(192,112,112,0.4);
  }

  .history-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 10px;
    letter-spacing: 0.1em;
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    border: 1px solid rgba(180,180,230,0.3);
    background: rgba(255,255,255,0.4);
    color: #a0a0c0;
    transition: all 0.2s;
  }

  .history-item {
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    font-size: 12px;
    color: #4a3a63;
    padding: 10px 12px;
    margin-bottom: 8px;
    border-radius: 12px;
    background: rgba(196, 160, 200, 0.1);
    border: 1px solid rgba(186, 158, 199, 0.4);
    text-align: left;
    line-height: 1.8;
  }

  .history-item strong {
    font-weight: 700;
    font-size: 12.5px;
    color: #3a2c50;
    display: block;
    margin-bottom: 4px;
  }

  .encouragement {
    font-family: 'Lora', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 12px;
    color: #6a5a8a;
    min-height: 18px;
    margin-bottom: 4px;
  }
</style>
</head>
<body>
<div class="widget">
  <span class="sparkles s1">✦</span>
  <span class="sparkles s2">✦</span>

  <!-- Tasks -->
  <div class="row">
    <div class="row-label">
      <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="3" width="18" height="18" rx="3" fill="#7a5c8a" opacity="0.15" stroke="#7a5c8a" stroke-width="1.5"/>
        <path d="M7 12.5l3.5 3.5 6.5-7" stroke="#7a5c8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Tasks completed
    </div>
    <div class="counter">
      <button class="count-btn" onclick="change('tasks', -1)">−</button>
      <div class="count-val" id="tasks-val">0</div>
      <button class="count-btn" onclick="change('tasks', 1)">+</button>
    </div>
  </div>

  <!-- Assignments -->
  <div class="row">
    <div class="row-label">
      <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="3" width="18" height="18" rx="3" fill="#7a5c8a" opacity="0.15" stroke="#7a5c8a" stroke-width="1.5"/>
        <path d="M12 5C10.5 5 8.5 5.4 7 6.5v9c1.5-.8 3.5-1.2 5-1.2s3.5.4 5 1.2v-9C15.5 5.4 13.5 5 12 5z" fill="#7a5c8a" opacity="0.3" stroke="#7a5c8a" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="12" y1="5" x2="12" y2="14.3" stroke="#7a5c8a" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      Assignments done
    </div>
    <div class="counter">
      <button class="count-btn" onclick="change('assignments', -1)">−</button>
      <div class="count-val" id="assignments-val">0</div>
      <button class="count-btn" onclick="change('assignments', 1)">+</button>
    </div>
  </div>

  <!-- Exams -->
  <div class="row">
    <div class="row-label">
      <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="3" width="16" height="18" rx="2" fill="#7a5c8a" opacity="0.15" stroke="#7a5c8a" stroke-width="1.5"/>
        <line x1="7.5" y1="8" x2="16.5" y2="8" stroke="#7a5c8a" stroke-width="1.3" stroke-linecap="round"/>
        <line x1="7.5" y1="11.3" x2="16.5" y2="11.3" stroke="#7a5c8a" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M8 15.8l2 2 4.5-4.8" stroke="#7a5c8a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Exams completed
    </div>
    <div class="counter">
      <button class="count-btn" onclick="change('exams', -1)">−</button>
      <div class="count-val" id="exams-val">0</div>
      <button class="count-btn" onclick="change('exams', 1)">+</button>
    </div>
  </div>

  <!-- Goals -->
  <div class="row">
    <div class="row-label">
      <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="8" fill="#7a5c8a" opacity="0.12" stroke="#7a5c8a" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="4.4" fill="none" stroke="#7a5c8a" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="1.3" fill="#7a5c8a"/>
      </svg>
      Goals achieved
    </div>
    <div class="counter">
      <button class="count-btn" onclick="change('goals', -1)">−</button>
      <div class="count-val" id="goals-val">0</div>
      <button class="count-btn" onclick="change('goals', 1)">+</button>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Habit Performance -->
  <div class="section-label">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 17l5-6 4 4 7-9" stroke="#6a5a8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    Habit Performance
  </div>
  <div class="chips">
    <div class="chip" id="habit-low" onclick="selectHabit('low')">Just Starting</div>
    <div class="chip" id="habit-mid" onclick="selectHabit('mid')">Building Up</div>
    <div class="chip" id="habit-high" onclick="selectHabit('high')">Excellent</div>
  </div>
  <div class="encouragement" id="habit-msg"></div>

  <div class="divider"></div>

  <div style="display:flex; gap:8px; justify-content:center; align-items:center;">
    <button class="save-btn" onclick="handleSaveClick()">
      <svg width="39" height="39" viewBox="0 0 24 24" style="margin-right:8px;" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 3h10a2 2 0 012 2v16l-8-4.5L3 21V5a2 2 0 012-2z" fill="#6a5a8a" opacity="0.85"/>
      </svg>
      Save this Month
    </button>
    <button class="history-btn" onclick="toggleHistory()">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" style="margin-right:6px;" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#a0a0c0" stroke-width="1.5"/>
        <path d="M12 7.5v5l3.3 2" stroke="#a0a0c0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      View History
    </button>
  </div>

  <div id="history-section" style="display:none; margin-top:12px;">
    <div class="divider"></div>
    <div class="section-label" style="justify-content:center;">Past Months</div>
    <div id="history-list" style="max-height: 220px; overflow-y: auto;"></div>
  </div>

  <div class="divider"></div>
  <button class="reset-btn" id="reset-btn" onclick="handleResetClick()">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" style="margin-right:5px;" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 12a8 8 0 0114-5.3M20 12a8 8 0 01-14 5.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/>
      <path d="M18 4v4h-4M6 20v-4h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    Reset for new month
  </button>

</div>

<script>
  const counts = { tasks: 0, assignments: 0, exams: 0, goals: 0 };
  let hasUnsavedChanges = false;

  function change(type, delta) {
    counts[type] = Math.max(0, counts[type] + delta);
    document.getElementById(type + '-val').textContent = counts[type];
    hasUnsavedChanges = true;
    save();
  }

  const habitMsgs = {
    low: "Every streak starts with day one. Keep going.",
    mid: "You're building something real. Don't stop now.",
    high: "You showed up all month. That's everything."
  };

  function selectHabit(level) {
    ['low','mid','high'].forEach(l => {
      document.getElementById('habit-' + l).className = 'chip';
    });
    document.getElementById('habit-' + level).classList.add(
      level === 'low' ? 'active-low' : level === 'mid' ? 'active-mid' : 'active-high'
    );
    document.getElementById('habit-msg').textContent = habitMsgs[level];
    localStorage.setItem('mr_habit', level);
    hasUnsavedChanges = true;
  }

  function save() {
    localStorage.setItem('mr_tasks', counts.tasks);
    localStorage.setItem('mr_assignments', counts.assignments);
    localStorage.setItem('mr_exams', counts.exams);
    localStorage.setItem('mr_goals', counts.goals);
  }

  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function getMonthRange() {
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    const key = year + '-' + String(month + 1).padStart(2, '0'); // stable YYYY-MM, safe for dedup
    return {
      key,
      label: `${MONTH_NAMES[month]} ${year}`
    };
  }

  function renderPeriodLabel() {
    const el = document.getElementById('period-label');
    if (el) el.textContent = getMonthRange().label;
  }

  let saveConfirmTimeout = null;

  function defaultSaveHTML() {
    return '<svg width="39" height="39" viewBox="0 0 24 24" style="margin-right:8px;">' +
      '<path d="M7 3h10a2 2 0 012 2v16l-8-4.5L3 21V5a2 2 0 012-2z" fill="#6a5a8a" opacity="0.85"/>' +
      '</svg>Save this Month';
  }

  // Bug fix (Sept 5, 2026), replacing the old monthAlreadySaved flag, which caused two bugs:
  // (a) it fired the overwrite prompt even when stats hadn't actually changed, because it only
  //     checked "was this ever saved," never "is this different from what's saved"; and
  // (b) it never got reset after deleteEntry() removed the saved record, so the prompt kept
  //     firing even when 0 months were actually saved. Checking live against mr_history every
  //     time, instead of caching a boolean, fixes both — there's no stale state left to go wrong.
  function getSavedEntryForCurrentMonth() {
    const { key } = getMonthRange();
    const history = JSON.parse(localStorage.getItem('mr_history') || '[]');
    return history.find(e => e.monthKey === key) || null;
  }

  function statsMatchSavedEntry(entry) {
    const habit = localStorage.getItem('mr_habit') || '—';
    return entry.tasks === counts.tasks &&
           entry.assignments === counts.assignments &&
           entry.exams === counts.exams &&
           entry.goals === counts.goals &&
           entry.habit === habit;
  }

  function handleSaveClick() {
    const btn = document.querySelector('.save-btn');
    if (btn.dataset.confirming === 'true') return; // ignore body click while Yes/No is showing

    const existing = getSavedEntryForCurrentMonth();
    if (existing && !statsMatchSavedEntry(existing)) {
      showSaveConfirm();
    } else {
      performSave();
    }
  }

  function showSaveConfirm() {
    const btn = document.querySelector('.save-btn');
    btn.dataset.confirming = 'true';
    btn.classList.add('confirming');
    btn.innerHTML =
      '<span class="save-confirm-text">Save new changes?</span>' +
      '<span class="save-confirm-actions">' +
      '<span class="save-yes" onclick="event.stopPropagation(); confirmSaveYes();">Yes</span>' +
      '<span class="save-no" onclick="event.stopPropagation(); confirmSaveNo();">No</span>' +
      '</span>';
    clearTimeout(saveConfirmTimeout);
    saveConfirmTimeout = setTimeout(confirmSaveNo, 6000);
  }

  function confirmSaveYes() {
    clearTimeout(saveConfirmTimeout);
    performSave();
  }

  function confirmSaveNo() {
    clearTimeout(saveConfirmTimeout);
    const btn = document.querySelector('.save-btn');
    btn.dataset.confirming = 'false';
    btn.classList.remove('confirming');
    btn.innerHTML = defaultSaveHTML();
  }

  function performSave() {
    const { key, label } = getMonthRange();
    const habit = localStorage.getItem('mr_habit') || '—';

    const entry = {
      monthKey: key,
      date: label,
      tasks: counts.tasks,
      assignments: counts.assignments,
      exams: counts.exams,
      goals: counts.goals,
      habit: habit
    };

    let history = JSON.parse(localStorage.getItem('mr_history') || '[]');
    // Duplicate prevention: remove existing entry for the same month (by stable key)
    history = history.filter(e => e.monthKey !== key);
    history.unshift(entry);
    // Max 8 entries
    if (history.length > 8) history = history.slice(0, 8);
    localStorage.setItem('mr_history', JSON.stringify(history));

    hasUnsavedChanges = false;

    const btn = document.querySelector('.save-btn');
    btn.dataset.confirming = 'false';
    btn.classList.remove('confirming');
    btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="margin-right:6px;"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#6a5a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>Saved!';
    setTimeout(() => btn.innerHTML = defaultSaveHTML(), 1500);

    renderHistory();
  }

  function toggleHistory() {
    const section = document.getElementById('history-section');
    section.style.display = section.style.display === 'none' ? 'block' : 'none';
    renderHistory();
  }

  const historyIcons = {
    tasks: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" style="vertical-align:-2px; margin-right:3px;"><rect x="3" y="3" width="18" height="18" rx="3" fill="#5fb88a" opacity="0.22" stroke="#5fb88a" stroke-width="1.8"/><path d="M7 12.5l3.5 3.5 6.5-7" stroke="#5fb88a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    assignments: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" style="vertical-align:-2px; margin-right:3px;"><path d="M12 5C10.5 5 8.5 5.4 7 6.5v9c1.5-.8 3.5-1.2 5-1.2s3.5.4 5 1.2v-9C15.5 5.4 13.5 5 12 5z" fill="#5c92c9" opacity="0.28" stroke="#5c92c9" stroke-width="1.4" stroke-linejoin="round"/><line x1="12" y1="5" x2="12" y2="14.3" stroke="#5c92c9" stroke-width="1.4" stroke-linecap="round"/></svg>`,
    exams: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" style="vertical-align:-2px; margin-right:3px;"><rect x="4" y="3" width="16" height="18" rx="2" fill="#c98a5c" opacity="0.22" stroke="#c98a5c" stroke-width="1.6"/><path d="M8 15.8l2 2 4.5-4.8" stroke="#c98a5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    goals: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" style="vertical-align:-2px; margin-right:3px;"><circle cx="12" cy="12" r="8" fill="#d97ba0" opacity="0.18" stroke="#d97ba0" stroke-width="1.5"/><circle cx="12" cy="12" r="4" fill="none" stroke="#d97ba0" stroke-width="1.5"/><circle cx="12" cy="12" r="1.2" fill="#d97ba0"/></svg>`,
    habit: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" style="vertical-align:-2px; margin-right:3px;"><path d="M4 17l5-6 4 4 7-9" stroke="#8a6fd9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`
  };

  let confirmingDeleteIndex = null;
  let deleteConfirmTimeout = null;

  function renderHistory() {
    const history = JSON.parse(localStorage.getItem('mr_history') || '[]');
    const list = document.getElementById('history-list');
    if (history.length === 0) {
      list.innerHTML = '<div class="history-item" style="color:#8a6fa0; font-style:italic;">No saved months yet.</div>';
      return;
    }
    list.innerHTML = history.map((e, i) => `
      <div class="history-item">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <strong>${e.date}</strong>
          <button onclick="handleDeleteClick(${i})" style="background:none;border:none;cursor:pointer;font-size:10px;color:${confirmingDeleteIndex === i ? '#c07070' : '#8a6fa0'};font-family:'Jost',sans-serif;font-weight:${confirmingDeleteIndex === i ? '600' : '500'};padding:0;margin-left:8px;line-height:1.3;flex-shrink:0;white-space:nowrap;" title="Delete">${confirmingDeleteIndex === i ? 'Sure?' : '✕'}</button>
        </div>
        ${historyIcons.tasks}${e.tasks} tasks &nbsp;·&nbsp; ${historyIcons.assignments}${e.assignments} assignments<br>
        ${historyIcons.exams}${e.exams} exams &nbsp;·&nbsp; ${historyIcons.goals}${e.goals} goals<br>
        ${historyIcons.habit}Habit: ${e.habit}
      </div>
    `).join('');
  }

  function handleDeleteClick(index) {
    if (confirmingDeleteIndex === index) {
      clearTimeout(deleteConfirmTimeout);
      confirmingDeleteIndex = null;
      deleteEntry(index);
    } else {
      confirmingDeleteIndex = index;
      renderHistory();
      clearTimeout(deleteConfirmTimeout);
      deleteConfirmTimeout = setTimeout(() => {
        confirmingDeleteIndex = null;
        renderHistory();
      }, 3000);
    }
  }

  function deleteEntry(index) {
    const history = JSON.parse(localStorage.getItem('mr_history') || '[]');
    history.splice(index, 1);
    localStorage.setItem('mr_history', JSON.stringify(history));
    renderHistory();
  }

  let resetConfirmTimeout = null;

  function handleResetClick() {
    const btn = document.getElementById('reset-btn');
    const defaultHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" style="margin-right:5px;"><path d="M4 12a8 8 0 0114-5.3M20 12a8 8 0 01-14 5.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/><path d="M18 4v4h-4M6 20v-4h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>Reset for new month`;

    if (btn.dataset.confirming === 'true') {
      clearTimeout(resetConfirmTimeout);
      resetAll();
      btn.dataset.confirming = 'false';
      btn.classList.remove('confirming');
      btn.innerHTML = defaultHTML;
    } else {
      btn.dataset.confirming = 'true';
      btn.classList.add('confirming');
      btn.textContent = hasUnsavedChanges
        ? "You haven't saved this month — tap again to reset anyway"
        : 'Tap again to confirm';

      resetConfirmTimeout = setTimeout(() => {
        btn.dataset.confirming = 'false';
        btn.classList.remove('confirming');
        btn.innerHTML = defaultHTML;
      }, 4000);
    }
  }

  function resetAll() {
    counts.tasks = 0;
    counts.assignments = 0;
    counts.exams = 0;
    counts.goals = 0;
    document.getElementById('tasks-val').textContent = 0;
    document.getElementById('assignments-val').textContent = 0;
    document.getElementById('exams-val').textContent = 0;
    document.getElementById('goals-val').textContent = 0;
    ['low','mid','high'].forEach(l => document.getElementById('habit-' + l).className = 'chip');
    document.getElementById('habit-msg').textContent = '';

    // Only remove this widget's own keys — never touch localStorage.clear(),
    // since other widgets on the same domain share this same storage bucket.
    localStorage.removeItem('mr_tasks');
    localStorage.removeItem('mr_assignments');
    localStorage.removeItem('mr_exams');
    localStorage.removeItem('mr_goals');
    localStorage.removeItem('mr_habit');
    // mr_history is intentionally preserved — reset should only clear this month's inputs.

    hasUnsavedChanges = false;
  }

  // Restore saved state
  renderPeriodLabel();
  counts.tasks = parseInt(localStorage.getItem('mr_tasks') || 0);
  counts.assignments = parseInt(localStorage.getItem('mr_assignments') || 0);
  counts.exams = parseInt(localStorage.getItem('mr_exams') || 0);
  counts.goals = parseInt(localStorage.getItem('mr_goals') || 0);
  document.getElementById('tasks-val').textContent = counts.tasks;
  document.getElementById('assignments-val').textContent = counts.assignments;
  document.getElementById('exams-val').textContent = counts.exams;
  document.getElementById('goals-val').textContent = counts.goals;
  const savedHabit = localStorage.getItem('mr_habit');
  if (savedHabit) selectHabit(savedHabit);
</script>
</body>
</html>
